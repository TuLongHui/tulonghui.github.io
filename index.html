<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>屠隆宝典 - 微信小程序</title>
<style>
@font-face{font-family:'SiyinSong';src:url('SiyinSong.woff2') format('woff2');font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,#0B1F14 0%,#061008 100%);
  font-family:'SiyinSong','Noto Serif SC','Songti SC',serif;
  overflow-x:hidden;position:relative}

/* 星星与雾气背景 */
.starfield{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;width:2px;height:2px;background:#E8C76450;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.8}}
.mist{position:fixed;bottom:-50%;left:-20%;width:140%;height:100%;
  background:radial-gradient(ellipse at 30% 70%,rgba(232,199,100,.04) 0%,transparent 50%),
             radial-gradient(ellipse at 70% 60%,rgba(232,199,100,.03) 0%,transparent 50%);
  pointer-events:none;z-index:0;animation:mistDrift 20s ease-in-out infinite alternate}
@keyframes mistDrift{0%{transform:translateX(-20px)}100%{transform:translateX(20px)}}

/* 主容器 */
.container{position:relative;z-index:1;text-align:center;padding:2rem 1.5rem;max-width:520px;width:100%}

/* 标题区 */
.title-wrap{margin-bottom:1.8rem}
.title{font-size:2.6rem;color:#E8C764;letter-spacing:.3em;font-weight:normal;
  text-shadow:0 0 20px rgba(232,199,100,.3),0 2px 4px rgba(0,0,0,.8);
  margin-bottom:.5rem;display:inline-block;position:relative}
.title::after{content:'';display:block;width:60%;height:1px;margin:.6rem auto 0;
  background:linear-gradient(90deg,transparent,#E8C76480,transparent)}
.subtitle{font-size:.85rem;color:#E8C76499;letter-spacing:.15em}

/* 卡片 */
.card{background:linear-gradient(145deg,rgba(11,31,20,.95),rgba(6,16,8,.98));
  border:1px solid rgba(232,199,100,.25);border-radius:12px;padding:2rem 1.5rem 1.8rem;
  box-shadow:0 8px 32px rgba(0,0,0,.6),0 0 40px rgba(232,199,100,.06),inset 0 1px 0 rgba(232,199,100,.1);
  position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 10%,#E8C76440,transparent 90%)}

/* 小程序码区域 */
.qr-area{display:flex;justify-content:center;margin:0 auto 1.5rem;position:relative}
.qr-frame{padding:10px;background:rgba(255,255,255,.97);border-radius:10px;
  box-shadow:0 4px 20px rgba(232,199,100,.15),0 0 0 1px rgba(232,199,100,.2);
  transition:transform .3s ease,box-shadow .3s ease}
.qr-frame:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(232,199,100,.25),0 0 0 1px rgba(232,199,100,.4)}
.qr-frame img{display:block;width:240px;height:240px;border-radius:6px}

/* 装饰角 */
.corner{position:absolute;width:18px;height:18px;border:2px solid #E8C764;opacity:.6}
.corner.tl{top:-4px;left:-4px;border-right:none;border-bottom:none;border-radius:4px 0 0 0}
.corner.tr{top:-4px;right:-4px;border-left:none;border-bottom:none;border-radius:0 4px 0 0}
.corner.bl{bottom:-4px;left:-4px;border-right:none;border-top:none;border-radius:0 0 0 4px}
.corner.br{bottom:-4px;right:-4px;border-left:none;border-top:none;border-radius:0 0 4px 0}

/* 提示文字 */
.tip{color:#E8C764CC;font-size:1rem;letter-spacing:.1em;line-height:1.8;margin-bottom:.4rem}
.tip-en{color:#E8C76466;font-size:.75rem;letter-spacing:.05em;margin-bottom:1.2rem}
.hint{color:#E8C76480;font-size:.8rem;letter-spacing:.05em;line-height:1.6}

/* 底部 */
.footer{margin-top:1.5rem;color:#E8C76440;font-size:.7rem;letter-spacing:.1em}

/* 太极图标 */
.taiji{display:inline-block;width:20px;height:20px;margin-bottom:.8rem;opacity:.35;
  animation:spin 12s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="starfield" id="starfield"></div>
<div class="mist"></div>

<div class="container">
  <div class="title-wrap">
    <svg class="taiji" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="48" fill="none" stroke="#E8C764" stroke-width="2"/>
      <path d="M50,2 A48,48 0 0,1 50,98 A24,24 0 0,1 50,50 A24,24 0 0,0 50,2 Z" fill="#E8C764"/>
      <circle cx="50" cy="26" r="6" fill="#0B1F14"/>
      <circle cx="50" cy="74" r="6" fill="#E8C764"/>
    </svg>
    <h1 class="title">屠隆宝典</h1>
    <p class="subtitle">DFSP 患者科普攻略</p>
  </div>

  <div class="card">
    <div class="qr-area">
      <div class="qr-frame">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>
        <img src="wechat-code.jpg" alt="屠隆宝典微信小程序码" />
      </div>
    </div>

    <p class="tip">微信扫码 · 进入屠隆宝典小程序</p>
    <p class="tip-en">Scan with WeChat to open the mini-program</p>
    <p class="hint">内容已全面迁移至微信小程序<br/>请使用微信扫一扫上方小程序码</p>
  </div>

  <div class="footer">屠隆宝典 · 2026</div>
</div>

<script>
// 生成星星
(function(){
  var sf = document.getElementById('starfield');
  for(var i=0;i<30;i++){
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.animationDelay = Math.random()*3 + 's';
    s.style.opacity = (Math.random()*0.6+0.2).toString();
    var sz = Math.random()*2+1;
    s.style.width = sz+'px';
    s.style.height = sz+'px';
    sf.appendChild(s);
  }
  // 随机流星
  for(var j=0;j<3;j++){
    var m = document.createElement('div');
    m.style.cssText = 'position:absolute;width:2px;height:2px;background:#E8C764;border-radius:50%;box-shadow:0 0 6px #E8C764;';
    m.style.left = Math.random()*100+'%';
    m.style.top = Math.random()*50+'%';
    m.style.animation = 'shoot '+(3+Math.random()*4)+'s ease-in '+(Math.random()*5)+'s infinite';
    sf.appendChild(m);
  }
  var style = document.createElement('style');
  style.textContent = '@keyframes shoot{0%{opacity:0;transform:translate(0,0)}10%{opacity:1}100%{opacity:0;transform:translate(200px,300px)}}';
  document.head.appendChild(style);
})();
</script>
</body>
</html>
