<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
background:radial-gradient(ellipse at center,#0B1F14 0%,#061008 100%);
font-family:'Songti SC','SimSun','Noto Serif SC',serif;
overflow-x:hidden}
.star{position:fixed;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.8}}
@keyframes shoot{0%{opacity:0;transform:translate(0,0)}10%{opacity:1}100%{opacity:0;transform:translate(200px,300px)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.wrap{position:relative;z-index:1;text-align:center;padding:2rem 1.5rem;max-width:520px;width:100%}
.wrap>*{animation:fadeInUp .8s ease-out backwards}
.wrap>:nth-child(1){animation-delay:.1s}
.wrap>:nth-child(2){animation-delay:.25s}
.wrap>:nth-child(3){animation-delay:.4s}
.wrap>:nth-child(4){animation-delay:.55s}
.wrap>:nth-child(5){animation-delay:.7s}
.badge{display:inline-block;padding:6px 20px;border:1px solid rgba(232,199,100,.3);border-radius:20px;
font-size:13px;letter-spacing:4px;color:rgba(232,199,100,.7);margin-bottom:2rem;background:rgba(232,199,100,.04)}
.title{font-size:2.6rem;color:#E8C764;letter-spacing:.3em;text-shadow:0 0 20px rgba(232,199,100,.3),0 2px 4px rgba(0,0,0,.8);margin-bottom:.5rem;font-family:'STKaiti','KaiTi','SimSun',serif}
.subtitle{font-size:14px;letter-spacing:6px;color:rgba(232,199,100,.5);margin-bottom:2.5rem}
.qr{position:relative;display:inline-block;padding:16px;background:#fff;
box-shadow:0 0 0 1px rgba(232,199,100,.2),0 0 40px rgba(232,199,100,.08),0 20px 60px rgba(0,0,0,.4);margin-bottom:2rem}
.qr::before{content:'';position:absolute;inset:-8px;border:1px solid rgba(232,199,100,.15);border-radius:0}
.corner{position:absolute;width:18px;height:18px;border:2px solid #E8C764}
.corner.tl{top:-12px;left:-12px;border-right:none;border-bottom:none}
.corner.tr{top:-12px;right:-12px;border-left:none;border-bottom:none}
.corner.bl{bottom:-12px;left:-12px;border-right:none;border-top:none}
.corner.br{bottom:-12px;right:-12px;border-left:none;border-top:none}
.qr img{display:block;width:258px;height:258px;-webkit-touch-callout:default;-webkit-user-select:none;user-select:none}
.scan-text{font-size:18px;color:#0B1F14;margin-top:12px;letter-spacing:2px;font-weight:600}
.notice{font-size:15px;color:rgba(232,199,100,.65);line-height:1.8;margin-bottom:1.5rem}
.notice b{color:#E8C764}
.footer{margin-top:2rem;padding-top:1.5rem;border-top:1px solid rgba(232,199,100,.08);font-size:12px;color:rgba(232,199,100,.3);letter-spacing:2px}
.footer a{color:rgba(232,199,100,.5);text-decoration:none;border-bottom:1px dashed rgba(232,199,100,.2)}
</style>
</head>
<body>
<div id="sf"></div>
<div class="wrap">

<div class="footer">TuLongHui · 屠隆宝典攻略<br><a href="https://github.com/TuLongHui/tulonghui.github.io">GitHub</a></div>
</div>
<script>
// 星空+流星
var sf=document.getElementById('sf');
for(var i=0;i<30;i++){var s=document.createElement('div');s.className='star';s.style.cssText='width:'+(Math.random()*2+1)+'px;height:'+(Math.random()*2+1)+'px;background:#E8C76450;position:fixed;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;animation-delay:'+Math.random()*3+'s;opacity:'+(Math.random()*.6+.2);sf.appendChild(s)}
