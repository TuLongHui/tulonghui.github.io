name: Daily Reminder Push
# 每天北京时间 09:00（UTC 01:00）扫描 data/reminder-subscriptions.json，
# 对明天到期/当天到期的未完成复查节点，经微信订阅消息推送给用户
# v2.4.4：原本为北京 18:00，但 GitHub 免费额度高峰排队延迟 5~10 小时，常拖到深夜运行；
# 提前到北京 09:00，即使再排队延迟也仍落在白天推送
on:
  schedule:
    - cron: '0 1 * * *'   # UTC 01:00 = 北京时间 09:00
  # repository_dispatch：fine-grained Token 无 actions 权限、无法用 API 点 workflow_dispatch，
  # 改走 dispatch 通道（只需 Contents 写权限），与 memory-identity 同款模式；
  # types 过滤，不与 memory-bind / memory-lookup / remind-identity 交叉触发
  repository_dispatch:
    types: [reminder-push]
  workflow_dispatch:
    inputs:
      mode:
        description: 'push = 定时推送 | check = 查看模板字段定义 | test = 给已绑定用户发测试消息'
        required: false
        default: 'push'
        type: choice
        options:
          - push
          - check
          - test

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run reminder script
        # repository_dispatch 触发时无 inputs，从 client_payload.mode 取模式
        run: node scripts/daily-reminder-push.cjs "${{ github.event.inputs.mode || github.event.client_payload.mode || 'push' }}"
        env:
          WX_APPID: wx46a511f1dfe2d724
          WX_APP_SECRET: ${{ secrets.APP_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
