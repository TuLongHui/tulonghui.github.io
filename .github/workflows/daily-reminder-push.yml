name: Daily Reminder Push
# 每天北京时间 18:00（UTC 10:00）扫描 data/reminder-subscriptions.json，
# 对明天到期/当天到期的未完成复查节点，经微信订阅消息推送给用户
on:
  schedule:
    - cron: '0 10 * * *'   # UTC 10:00 = 北京时间 18:00
  workflow_dispatch:
    inputs:
      mode:
        description: 'push = 定时推送 | check = 查看模板字段定义 | test = 给已绑定用户发测试消息'
        required: false
        default: 'push'
        type: choice
        options:
          - push
          - check
          - test

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run reminder script
        run: node scripts/daily-reminder-push.cjs "${{ github.event.inputs.mode || 'push' }}"
        env:
          WX_APPID: wx46a511f1dfe2d724
          WX_APP_SECRET: ${{ secrets.APP_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
