name: Daily Reminder Push
# 每天北京时间 18:00（UTC 10:00）扫描 data/reminder-subscriptions.json，
# 对明天到期/当天到期的未完成复查节点，经微信订阅消息推送给用户
on:
  schedule:
    - cron: '0 10 * * *'   # UTC 10:00 = 北京时间 18:00
  workflow_dispatch: {}     # 支持手动触发测试

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan plans and send subscribe messages
        run: node scripts/daily-reminder-push.cjs
        env:
          WX_APPID: wx46a511f1dfe2d724
          WX_APP_SECRET: ${{ secrets.APP_SECRET }}
