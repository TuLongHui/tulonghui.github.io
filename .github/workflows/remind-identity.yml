name: Remind Identity
# 用户在小程序订阅成功后，客户端用 wx.login 的 code 实时触发本工作流，
# 用 AppSecret 调 jscode2session 换 openid，经 contents API 绑定到 data/reminder-subscriptions.json。
# v2: 脚本内直接读-改-写远程数据（带重试），不再走 git 提交，根除并发触发时的 rebase 冲突。
on:
  workflow_dispatch:
    inputs:
      code:
        description: 'wx.login code (valid 5 min)'
        required: true
      userId:
        description: 'local user id'
        required: true

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Exchange code for openid and bind
        run: node scripts/remind-identity.cjs "${{ github.event.inputs.code }}" "${{ github.event.inputs.userId }}"
        env:
          WX_APPID: wx46a511f1dfe2d724
          WX_APP_SECRET: ${{ secrets.APP_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
